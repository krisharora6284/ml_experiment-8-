name: ML pipeline
on:
  push: 
    branches: [main]
  workflow_dispatch:
jobs: 
  train-and-test: 
    runs-on: ubuntu-latest
    steps: 
      - name: Download Project code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version:"3.13"
      - name: Install libraries/dependencies
        run: pip install -r requirements.txt
      - name: ML model training
        run: python train.py
      - name: ML model testing
        run: python test.py           